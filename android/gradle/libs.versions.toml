[versions]
kotlin = "2.3.20"
agp = "8.13.2"
coroutines = "1.11.0"
# Pinned to the version `client/.venv` runs, because the golden vectors in
# fixtures/wakeword/ were generated by that build of ONNX Runtime. Bumping one
# side without the other turns a real divergence into an unexplained rounding
# difference.
onnxruntime = "1.28.0"
serialization = "1.11.0"
okhttp = "4.12.0"

[libraries]
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
